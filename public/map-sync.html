<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>地圖同步 · 後台觀看</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Noto Sans TC", sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: #1f2a30; color: #fff; font-size: 14px; }
    #bar input { padding: 6px 8px; border: none; border-radius: 6px; font-size: 14px; }
    #bar button { padding: 6px 14px; border: none; border-radius: 6px; background: #4a90e2; color: #fff; font-weight: 700; cursor: pointer; }
    #bar button.on { background: #e0533d; }
    #dot { width: 10px; height: 10px; border-radius: 50%; background: #7a8a92; }
    .fix { color: #8aa0ab; font-family: ui-monospace, monospace; }
    #dot.on { background: #37d67a; }
    #map { flex: 1; }
    #status { color: #b9c6cd; }
    #log { height: 120px; overflow: auto; margin: 0; padding: 6px 10px; background: #14202a; color: #7fd6a3; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
  <div id="bar">
    <b>🚲 後台觀看</b>
    <label>topic <span class="fix">ebike/</span><input id="room" size="10" /><span class="fix">/route · /gps</span></label>
    <button id="connectBtn">連線</button>
    <span id="dot"></span>
    <span id="status">未連線</span>
    <span id="slope" style="margin-left:auto;font-weight:700">坡度 —</span>
  </div>
  <div id="map"></div>
  <pre id="log"></pre>

  <script src="./config.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
  // 後台：訂閱同房間 → 用自己的 Google 地圖，把 App 送來的路線 / GPS 畫出來。
  const CFG = window.MAP_SYNC || {};
  const $ = (id) => document.getElementById(id);
  $("room").value = CFG.room || "ebike-demo";

  let client = null, map = null;
  let routeLine = null, segLines = [], endMarkers = [], gpsMarker = null;

  // 依坡度給顏色（與 App 的 slope.js 一致）
  function gradeColor(g) {
    if (g <= -3) return "#1565c0"; // 明顯下坡 深藍
    if (g < 1)  return "#43a047";  // 平緩 綠
    if (g < 4)  return "#9ccc65";  // 微上坡 淺綠
    if (g < 7)  return "#fdd835";  // 中等 黃
    if (g < 10) return "#fb8c00";  // 陡 橘
    if (g < 13) return "#e53935";  // 很陡 紅
    return "#8e24aa";              // 超陡 紫
  }

  function setStatus(txt, on) {
    $("status").textContent = txt;
    $("dot").classList.toggle("on", !!on);
  }
  // 最新的寫在最上面：[時間] topic → 內容
  function log(topic, payload) {
    const t = new Date().toLocaleTimeString();
    $("log").textContent = `[${t}] ${topic}\n  ${payload}\n` + $("log").textContent;
  }
  const topics = () => {
    const base = "ebike/" + ($("room").value.trim() || "default");
    return { route: base + "/route", gps: base + "/gps" };
  };

  // 載入 Google Maps
  function loadGmaps() {
    return new Promise((res, rej) => {
      if (window.google && window.google.maps) return res();
      if (!CFG.googleKey) return rej(new Error("config.js 沒填 googleKey"));
      const s = document.createElement("script");
      s.src = `https://maps.googleapis.com/maps/api/js?key=${CFG.googleKey}&libraries=geometry`;
      s.onload = res;
      s.onerror = () => rej(new Error("Google Maps 載入失敗（檢查金鑰 / 網域白名單）"));
      document.head.appendChild(s);
    });
  }
  function initMap() {
    if (map) return;
    map = new google.maps.Map($("map"), {
      center: { lat: 25.0478, lng: 121.517 }, zoom: 13, disableDefaultUI: true, zoomControl: true,
    });
  }

  // 連線 / 斷線
  $("connectBtn").onclick = async () => {
    if (client && client.connected) { client.end(true); return; }
    try {
      setStatus("載入地圖…", false);
      await loadGmaps();
      initMap();
      connectMqtt();
    } catch (e) { setStatus("失敗：" + e.message, false); }
  };

  function connectMqtt() {
    const url = CFG.broker || "wss://broker.emqx.io:8084/mqtt";
    setStatus("連線 broker…", false);
    client = mqtt.connect(url, { clientId: "viewer-" + Math.random().toString(16).slice(2, 8), reconnectPeriod: 3000 });
    client.on("connect", () => {
      setStatus("已連線 · 等待前台…", true);
      $("connectBtn").textContent = "斷線"; $("connectBtn").classList.add("on");
      const t = topics();
      client.subscribe([t.route, t.gps], { qos: 1 });
    });
    client.on("close", () => {
      setStatus("已斷線", false);
      $("connectBtn").textContent = "連線"; $("connectBtn").classList.remove("on");
    });
    client.on("error", (e) => setStatus("broker 錯誤：" + e.message, false));
    client.on("message", onMessage);
  }

  function onMessage(topic, buf) {
    const raw = buf.toString();
    log(topic, raw);
    let msg; try { msg = JSON.parse(raw); } catch { return; }
    const t = topics();
    if (topic === t.route) drawRoute(msg);
    else if (topic === t.gps) moveGps(msg.lat, msg.lng, msg.heading);
  }

  // 清空地圖上的路線 / 分段 / 起終點 / GPS 箭頭
  function clearAll() {
    if (routeLine) { routeLine.setMap(null); routeLine = null; }
    segLines.forEach((l) => l.setMap(null)); segLines = [];
    endMarkers.forEach((m) => m.setMap(null)); endMarkers = [];
    if (gpsMarker) { gpsMarker.setMap(null); gpsMarker = null; }
    $("slope").textContent = "坡度 —";
  }

  function drawRoute(msg) {
    // 前台結束導航（或 App 斷線遺囑）→ 清空
    if (msg.end) { clearAll(); setStatus("前台已結束導航", true); return; }
    // 新路線 → 先把上一趟的線 / 分段 / 箭頭全清掉
    clearAll();

    const path = google.maps.geometry.encoding.decodePath(msg.polyline);
    const b = new google.maps.LatLngBounds();

    // 有分段坡度 → 照坡度上色（整條路的坡度）；沒有就退回單一藍線
    if (msg.segments && msg.segments.length) {
      msg.segments.forEach((s) => {
        const segPath = google.maps.geometry.encoding.decodePath(s.poly);
        segLines.push(new google.maps.Polyline({
          path: segPath, strokeColor: gradeColor(s.grade), strokeOpacity: 0.95, strokeWeight: 6, map,
        }));
      });
      path.forEach((p) => b.extend(p));
      const mg = msg.summary?.maxGrade;
      $("slope").textContent = `整條路：分 ${msg.segments.length} 段` +
        (mg != null ? ` · 最陡 ${mg >= 0 ? "+" : ""}${Number(mg).toFixed(1)}%` : "");
    } else {
      routeLine = new google.maps.Polyline({ path, strokeColor: "#1a73e8", strokeWeight: 5, map });
      path.forEach((p) => b.extend(p));
    }

    endMarkers = [
      new google.maps.Marker({ position: path[0], map, label: "起" }),
      new google.maps.Marker({ position: path[path.length - 1], map, label: "終" }),
    ];
    map.fitBounds(b);
    setStatus(`同步中：${msg.from || ""} → ${msg.to || ""}`, true);
  }

  function moveGps(lat, lng, heading) {
    const pos = { lat, lng };
    if (!gpsMarker) {
      gpsMarker = new google.maps.Marker({
        map, zIndex: 999,
        icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 5, fillColor: "#e0533d", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2, rotation: heading || 0 },
      });
    }
    gpsMarker.setPosition(pos);
    const ic = gpsMarker.getIcon(); ic.rotation = heading || 0; gpsMarker.setIcon(ic);
    map.panTo(pos);
  }
  </script>
</body>
</html>
