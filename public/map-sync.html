<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>地圖 MQTT 同步測試</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Noto Sans TC", sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar {
      background: #1f2a30; color: #fff; padding: 10px 12px;
      display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 13px;
    }
    #bar label { display: inline-flex; align-items: center; gap: 5px; }
    #bar input[type=text] {
      border: none; border-radius: 7px; padding: 6px 9px; font-size: 13px; min-width: 120px;
    }
    #bar .role { display: inline-flex; background: #33424b; border-radius: 8px; overflow: hidden; }
    #bar .role button {
      border: none; background: transparent; color: #b9c6cd; padding: 6px 12px; cursor: pointer; font-weight: 700;
    }
    #bar .role button.on { background: #2fa860; color: #fff; }
    #connectBtn {
      border: none; border-radius: 8px; padding: 7px 16px; font-weight: 700; cursor: pointer;
      background: #4a90e2; color: #fff;
    }
    #connectBtn.on { background: #e0533d; }
    #dot { width: 11px; height: 11px; border-radius: 50%; background: #7a8a92; display: inline-block; }
    #dot.on { background: #37d67a; box-shadow: 0 0 0 3px rgba(55,214,122,.3); }
    #panel { padding: 9px 12px; background: #eef2f4; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
    #panel input { border: 1px solid #cdd6db; border-radius: 7px; padding: 7px 10px; font-size: 14px; }
    #panel button {
      border: none; border-radius: 7px; padding: 8px 14px; font-weight: 700; cursor: pointer; color: #fff; background: #2fa860;
    }
    #panel button.sec { background: #6b7a82; }
    #panel button:disabled { opacity: .45; cursor: default; }
    #viewerInfo { color: #37505c; font-weight: 600; }
    #map { flex: 1; min-height: 200px; }
    #log { background: #14202a; color: #7fd6a3; font: 11px/1.5 ui-monospace, monospace; padding: 6px 10px; height: 74px; overflow: auto; white-space: pre-wrap; }
    .hint { color: #9fb0b8; }
  </style>
</head>
<body>
  <div id="bar">
    <b>🚲 地圖同步測試</b>
    <span class="role" id="roleSel">
      <button data-role="front" class="on">前台（發送）</button>
      <button data-role="back">後台（觀看）</button>
    </span>
    <label>房間 <input type="text" id="room" placeholder="兩邊要一樣" /></label>
    <label>Google 金鑰 <input type="text" id="key" placeholder="貼上 .env 那把" style="min-width:180px" /></label>
    <label class="hint">broker <input type="text" id="broker" style="min-width:210px" /></label>
    <button id="connectBtn">連線</button>
    <span id="dot"></span><span id="status" class="hint">未連線</span>
  </div>

  <div id="panel"><!-- 依角色動態塞內容 --></div>

  <div id="map"></div>
  <div id="log"></div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
  //=================================================================
  //  地圖 MQTT 同步 —— 概念驗證
  //  前台：Google Directions 規劃路線 → 把 encoded polyline + GPS 發到 MQTT
  //  後台：訂閱同一房間 → 用「自己的」Google 地圖把收到的座標畫出來
  //  兩顆地圖從不互相溝通，只是收到同一份座標 → 看起來同步。
  //=================================================================
  const $ = (id) => document.getElementById(id);
  const LS = window.localStorage;

  // 記住上次輸入
  $("key").value = LS.getItem("ms_key") || "";
  $("broker").value = LS.getItem("ms_broker") || "wss://broker.emqx.io:8084/mqtt";
  $("room").value = LS.getItem("ms_room") || ("ebike-" + Math.random().toString(36).slice(2, 6));

  let role = "front";          // front | back
  let client = null;           // mqtt client
  let map, directionsRenderer; // google 物件
  let gpsMarker = null, viewerLine = null, endMarkers = [];
  let currentPath = null;      // 前台目前規劃出的路徑（模擬騎乘用）
  let simTimer = null, watchId = null;

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    $("log").textContent = `[${t}] ${msg}\n` + $("log").textContent;
  }
  function setStatus(txt, on) {
    $("status").textContent = txt;
    $("dot").classList.toggle("on", !!on);
  }
  const topics = () => {
    const base = "ebike/" + ($("room").value.trim() || "default");
    return { route: base + "/route", gps: base + "/gps" };
  };

  //--- 角色切換 ----------------------------------------------------
  $("roleSel").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    [...$("roleSel").children].forEach((x) => x.classList.remove("on"));
    b.classList.add("on");
    role = b.dataset.role;
    renderPanel();
    // 切角色若已連線，重訂閱
    if (client && client.connected) subscribeIfViewer();
  });

  function renderPanel() {
    const p = $("panel");
    if (role === "front") {
      p.innerHTML = `
        <input id="from" type="text" placeholder="起點（例：台北車站）" style="min-width:180px" />
        <input id="to" type="text" placeholder="目的地（例：台北101）" style="min-width:180px" />
        <button id="planBtn">規劃路線</button>
        <button id="simBtn" class="sec">▶ 模擬騎乘</button>
        <button id="stopBtn" class="sec">■ 停止</button>
        <button id="gpsBtn" class="sec">📍 用真實GPS</button>`;
      $("planBtn").onclick = planRoute;
      $("simBtn").onclick = simulateRide;
      $("stopBtn").onclick = stopMoving;
      $("gpsBtn").onclick = toggleRealGps;
    } else {
      p.innerHTML = `<span id="viewerInfo">後台觀看模式：等待前台送出路線…（房間要跟前台一樣）</span>`;
    }
  }
  renderPanel();

  //--- 連線按鈕 ----------------------------------------------------
  $("connectBtn").onclick = async () => {
    if (client && client.connected) { client.end(true); return; }
    const key = $("key").value.trim();
    if (!key) { alert("請先貼上 Google Maps 金鑰"); return; }
    LS.setItem("ms_key", key);
    LS.setItem("ms_broker", $("broker").value.trim());
    LS.setItem("ms_room", $("room").value.trim());
    try {
      setStatus("載入地圖…", false);
      await loadGmaps(key);
      initMap();
      connectMqtt();
    } catch (e) {
      setStatus("失敗：" + e.message, false);
      log("✗ " + e.message);
    }
  };

  //--- Google Maps ------------------------------------------------
  function loadGmaps(key) {
    return new Promise((res, rej) => {
      if (window.google && window.google.maps) return res();
      const s = document.createElement("script");
      s.src = `https://maps.googleapis.com/maps/api/js?key=${key}&libraries=geometry`;
      s.onload = res;
      s.onerror = () => rej(new Error("Google Maps 載入失敗（檢查金鑰 / 網域白名單）"));
      document.head.appendChild(s);
    });
  }
  function initMap() {
    if (map) return;
    map = new google.maps.Map($("map"), {
      center: { lat: 25.0478, lng: 121.5170 }, zoom: 13,
      disableDefaultUI: true, zoomControl: true,
    });
    directionsRenderer = new google.maps.DirectionsRenderer({
      map, suppressMarkers: false, polylineOptions: { strokeColor: "#1a73e8", strokeWeight: 5 },
    });
  }

  //--- MQTT --------------------------------------------------------
  function connectMqtt() {
    const url = $("broker").value.trim();
    setStatus("連線 broker…", false);
    log("連線 " + url);
    client = mqtt.connect(url, {
      clientId: role + "-" + Math.random().toString(16).slice(2, 8),
      clean: true, reconnectPeriod: 3000, connectTimeout: 8000,
    });
    client.on("connect", () => {
      setStatus("已連線（" + (role === "front" ? "前台" : "後台") + "）", true);
      $("connectBtn").textContent = "斷線"; $("connectBtn").classList.add("on");
      log("✅ broker 已連線");
      subscribeIfViewer();
    });
    client.on("reconnect", () => setStatus("重連中…", false));
    client.on("error", (e) => { setStatus("broker 錯誤", false); log("✗ " + e.message); });
    client.on("close", () => {
      setStatus("已斷線", false);
      $("connectBtn").textContent = "連線"; $("connectBtn").classList.remove("on");
    });
    client.on("message", onMessage);
  }
  function subscribeIfViewer() {
    if (!client || !client.connected) return;
    const t = topics();
    if (role === "back") {
      client.subscribe([t.route, t.gps], { qos: 1 }, () => log("已訂閱 " + t.route + " / gps"));
    } else {
      client.unsubscribe([t.route, t.gps]);
    }
  }

  function onMessage(topic, buf) {
    if (role !== "back") return;
    let msg; try { msg = JSON.parse(buf.toString()); } catch { return; }
    const t = topics();
    if (topic === t.route) drawReceivedRoute(msg);
    else if (topic === t.gps) moveGps(msg.lat, msg.lng, msg.heading);
  }

  //================= 前台：規劃 + 發送 ==============================
  function planRoute() {
    const from = $("from").value.trim(), to = $("to").value.trim();
    if (!from || !to) { alert("請輸入起點與目的地"); return; }
    if (!client || !client.connected) { alert("請先按「連線」"); return; }
    const ds = new google.maps.DirectionsService();
    log("規劃路線 " + from + " → " + to);
    ds.route(
      { origin: from, destination: to, travelMode: google.maps.TravelMode.DRIVING },
      (res, status) => {
        if (status !== "OK") { log("✗ 路線失敗：" + status); alert("路線規劃失敗：" + status); return; }
        directionsRenderer.setDirections(res);
        const r = res.routes[0];
        currentPath = r.overview_path;
        const polyline = google.maps.geometry.encoding.encodePath(currentPath);
        const leg = r.legs[0];
        const msg = {
          from, to, polyline,
          summary: { distText: leg.distance.text, durText: leg.duration.text },
        };
        // retain: true → 後台晚一點連進來也會立刻收到最後這條路線
        client.publish(topics().route, JSON.stringify(msg), { qos: 1, retain: true });
        log("→ 已發送路線（polyline " + polyline.length + " 字元）");
      }
    );
  }

  function simulateRide() {
    if (!currentPath) { alert("請先「規劃路線」"); return; }
    stopMoving();
    // 把 overview_path 內插成較密的點，動起來才順
    const dense = densify(currentPath, 25);
    let i = 0;
    log("▶ 模擬騎乘 " + dense.length + " 點");
    simTimer = setInterval(() => {
      if (i >= dense.length) { stopMoving(); log("■ 抵達終點"); return; }
      const p = dense[i++];
      const heading = i < dense.length ? google.maps.geometry.spherical.computeHeading(p, dense[i] || p) : 0;
      moveGps(p.lat(), p.lng(), heading);
      client.publish(topics().gps, JSON.stringify({ lat: p.lat(), lng: p.lng(), heading }), { qos: 0 });
    }, 250);
  }

  let realGpsOn = false;
  function toggleRealGps() {
    if (realGpsOn) { navigator.geolocation.clearWatch(watchId); realGpsOn = false; $("gpsBtn").textContent = "📍 用真實GPS"; log("停止真實GPS"); return; }
    if (!navigator.geolocation) { alert("此裝置沒有定位"); return; }
    stopMoving();
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const { latitude: lat, longitude: lng, heading } = pos.coords;
        moveGps(lat, lng, heading || 0);
        if (client && client.connected) client.publish(topics().gps, JSON.stringify({ lat, lng, heading: heading || 0 }), { qos: 0 });
      },
      (err) => log("✗ GPS：" + err.message),
      { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
    );
    realGpsOn = true; $("gpsBtn").textContent = "📍 停止GPS"; log("📍 開始真實GPS（走動看看）");
  }

  function stopMoving() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

  //================= 後台：收到就畫 ================================
  // 清空後台地圖上的路線 / 起終點 / GPS 箭頭
  function clearViewer() {
    if (viewerLine) { viewerLine.setMap(null); viewerLine = null; }
    endMarkers.forEach((m) => m.setMap(null)); endMarkers = [];
    if (gpsMarker) { gpsMarker.setMap(null); gpsMarker = null; }
  }

  function drawReceivedRoute(msg) {
    // 前台結束導航（或 App 意外斷線的遺囑）→ 清空畫面
    if (msg.end) {
      clearViewer();
      $("viewerInfo").textContent = "前台已結束導航";
      log("← 前台結束導航，已清空地圖");
      return;
    }
    const path = google.maps.geometry.encoding.decodePath(msg.polyline);
    if (viewerLine) viewerLine.setMap(null);
    viewerLine = new google.maps.Polyline({ path, strokeColor: "#1a73e8", strokeWeight: 5, map });
    endMarkers.forEach((m) => m.setMap(null));
    endMarkers = [
      new google.maps.Marker({ position: path[0], map, label: "起" }),
      new google.maps.Marker({ position: path[path.length - 1], map, label: "終" }),
    ];
    const b = new google.maps.LatLngBounds();
    path.forEach((p) => b.extend(p));
    map.fitBounds(b);
    $("viewerInfo").textContent = `已同步路線：${msg.from} → ${msg.to}　(${msg.summary?.distText || ""}, ${msg.summary?.durText || ""})`;
    log("← 收到並畫出路線");
  }

  //--- 共用：移動 GPS marker --------------------------------------
  function moveGps(lat, lng, heading) {
    const pos = { lat, lng };
    if (!gpsMarker) {
      gpsMarker = new google.maps.Marker({
        map, zIndex: 999,
        icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 5, fillColor: "#e0533d", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2, rotation: heading || 0 },
      });
    }
    gpsMarker.setPosition(pos);
    const ic = gpsMarker.getIcon();
    ic.rotation = heading || 0;
    gpsMarker.setIcon(ic);
    if (role === "back") map.panTo(pos);
  }

  // 把稀疏路徑點內插成每段最多 step 個點，動畫較順
  function densify(path, step) {
    const sph = google.maps.geometry.spherical, out = [];
    for (let i = 0; i < path.length - 1; i++) {
      const a = path[i], b = path[i + 1];
      const d = sph.computeDistanceBetween(a, b);
      const n = Math.max(1, Math.min(step, Math.round(d / 20)));
      for (let k = 0; k < n; k++) out.push(sph.interpolate(a, b, k / n));
    }
    out.push(path[path.length - 1]);
    return out;
  }
  </script>
</body>
</html>
